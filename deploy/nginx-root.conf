# Alternative: a dedicated domain with a root-path frontend build.
# Set ARCHIVE_PUBLIC_ORIGIN to the real domain origin and configure HTTPS
# in your normal reverse proxy before using management over the Internet.
server {
    listen 80;
    server_name books.example.org;

    location / {
        proxy_pass http://127.0.0.1:4178;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 180m;
        proxy_read_timeout 60s;
    }
}
