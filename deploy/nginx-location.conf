# Include inside the existing public server {} block.
# Build the frontend without ARCHIVE_BASE_PATH for the root URL.
location = /wenku {
    return 301 /;
}

location /wenku/ {
    return 301 /;
}

# Keep the previous site available at /worldseed/.
location /worldseed/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location / {
    proxy_pass http://127.0.0.1:4178;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 180m;
    proxy_read_timeout 60s;
}
