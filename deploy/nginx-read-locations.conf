# Preserve both modern prefixed and older npm CLI endpoints.
location = /nikowenku-archive/api/health {
    include /etc/nginx/snippets/niko-wenku-read-proxy.conf;
    proxy_pass http://niko_wenku_read/api/health;
}
location = /nikowenku-archive/api/library {
    include /etc/nginx/snippets/niko-wenku-read-proxy.conf;
    proxy_pass http://niko_wenku_read/api/library;
}
location /nikowenku-archive/api/books/ {
    include /etc/nginx/snippets/niko-wenku-read-proxy.conf;
    proxy_pass http://niko_wenku_read/api/books/;
}
location = /api/health {
    include /etc/nginx/snippets/niko-wenku-read-proxy.conf;
    proxy_pass http://niko_wenku_read;
}
location = /api/library {
    include /etc/nginx/snippets/niko-wenku-read-proxy.conf;
    proxy_pass http://niko_wenku_read;
}
location /api/books/ {
    include /etc/nginx/snippets/niko-wenku-read-proxy.conf;
    proxy_pass http://niko_wenku_read;
}
